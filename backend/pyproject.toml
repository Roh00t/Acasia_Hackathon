[project]
name = "atm"
version = "0.1.0"
description = "Multi-agent arrival disruption negotiation (Autonomous SG 2026, Airbus Challenge #2)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "pandas>=2.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atm"]
